name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare documentation
        run: |
          python .mkdocs/scripts/prepare_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with MkDocs
        run: mkdocs build

      - name: Fix anchor fragments (i18n trailing slash)
        run: python .mkdocs/scripts/fix_anchor_slashes.py build/site

      - name: Check site anchors
        run: python .mkdocs/scripts/check_site_anchors.py build/site

      - name: Check llms.txt / 404 artifacts
        run: python .mkdocs/scripts/check_llms_txt.py build/site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

